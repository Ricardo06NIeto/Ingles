{t:"To be: preguntas y respuestas",l:"A1",r:"<b>I am</b>, <b>you / we / they are</b>, <b>he / she / it is</b>. Pregunta: <i>Are you...?</i> Respuesta corta: <i>Yes, I am. / No, I am not.</i> Con Where / Who / What: <i>Where is the bank?</i>",e:["Where is classroom 415? It is on the fourth floor.","Are you a new student? Yes, I am.","She is not sick; she is fine."],k:"En la respuesta corta afirmativa no se contrae: Yes, I am (no Yes, I'm).",v:[["classroom","salón de clases"],["floor","piso"],["student","estudiante"],["sick","enfermo"],["fine","bien"]],d:"A: Are you a new student? B: Yes, I am. A: Where is classroom 415? B: It is on the fourth floor.",p:["Where is classroom 415","Yes I am","She is not sick"],tip:"Practiquen pregunta y respuesta corta en pareja. Error típico: omitir el sujeto o responder Yes, I'm.",m:["Are you a new student?|Yes, I am.|Yes, I do.|Yes, I is.|No, I do.|0","___ is the bank? It is on Main Street.|Who|Where|When|What|1","She ___ sick. She is fine.|is|are|is not|am|2"]},
{t:"Opuestos, sinónimos y descripciones",l:"A1",r:"Un <b>opuesto</b> es la palabra contraria (open / closed). Un <b>sinónimo</b> significa lo mismo (big / large). Se usan con to be para describir cosas y personas.",e:["The bank is not open; it is closed.","The box is big. It is large.","The test is easy, not difficult."],k:"Aprende las parejas completas: hot / cold, old / new, easy / difficult.",v:[["open","abierto"],["closed","cerrado"],["old","viejo"],["new","nuevo"],["difficult","difícil"]],d:"A: Is the bank open? B: No, it is closed. A: Is the test easy? B: No, it is difficult.",p:["The bank is closed","The box is big","The test is difficult"],tip:"Haz tarjetas con parejas de opuestos y sinónimos. Pídele que describa objetos del salón con 3 adjetivos.",m:["The bank is not open; it is ___.|close|closed|opened|closing|1","The opposite of hot is ___.|warm|cold|sunny|new|1","Big and large are ___.|opposites|questions|synonyms|numbers|2"]},
{t:"Ocupaciones, familia, días y meses",l:"A1",r:"Ocupaciones: <i>a clerk works in an office; waiters serve tables in restaurants</i>. Familia: mother, father, brother, sister, uncle, grandmother. Días: Monday a Sunday. Meses: January a December. Siempre con mayúscula.",e:["A clerk works in an office.","Waiters and waitresses serve tables in restaurants.","My sister is a teacher. Her birthday is in March."],k:"Los días y los meses llevan mayúscula en inglés: Monday, March.",v:[["clerk","empleado"],["waiter","mesero"],["uncle","tío"],["Wednesday","miércoles"],["February","febrero"]],d:"A: What does your father do? B: He is a doctor. A: When is your birthday? B: My birthday is in March.",p:["A clerk works in an office","My brother is a waiter","My birthday is in February"],tip:"Repasen días y meses con un calendario real. Que diga la ocupación de cada familiar.",m:["A ___ works in an office.|clerk|waiter|doctor|farmer|0","The day after Monday is ___.|Sunday|Tuesday|Friday|Wednesday|1","My mother's brother is my ___.|father|cousin|uncle|son|2"]},
{t:"Presente simple y adverbios de frecuencia",l:"A1",r:"Hábitos y rutinas. He / she / it + <b>-s</b>. Negativa: <i>don't / doesn't</i>. Pregunta: <b>Do / Does</b> + sujeto + verbo. Respuesta corta: <i>Yes, he does. / No, he doesn't.</i> Adverbios: always, almost always, usually, sometimes, never.",e:["When do you watch TV? I watch TV every day.","Does Pete go to the beach? Yes, sometimes.","Pete goes to the beach in summer."],k:"El adverbio va antes del verbo: I always eat breakfast.",v:[["always","siempre"],["usually","normalmente"],["sometimes","a veces"],["never","nunca"],["every day","todos los días"]],d:"A: Does Pete go to the beach? B: Yes, he does. He goes in summer. A: Do you watch TV every day? B: No, I don't.",p:["I watch TV every day","Does Pete go to the beach","He never eats fish"],tip:"Olvidar la -s con he / she / it es el error más común. Practiquen 10 frases sobre su rutina.",m:["Does Pete go to the beach?|Yes, he does.|Yes, he go.|Yes, he is.|No, he don't.|0","She ___ to school by bus every day.|go|goes|going|is go|1","___ you watch TV every day?|Do|Does|Are|Is|0"]},
{t:"Pronombres, posesivos y demostrativos",l:"A1",r:"<b>Adjetivos posesivos:</b> my, your, his, her, our, their. <b>Pronombres objeto:</b> me, you, him, her, us, them. <b>Demostrativos:</b> this / that (singular), these / those (plural).",e:["This is my book, and that is your book.","Helen likes carrots. I like her.","These apples are red; those are green."],k:"Después del verbo usa pronombre objeto: I see her (no I see she).",v:[["my","mi"],["her","su (de ella) / la"],["him","lo, él"],["these","estos"],["those","aquellos"]],d:"A: Is this your pen? B: No, it is her pen. A: Who likes carrots? B: Helen does. I like her.",p:["This is my book","Helen likes carrots","These apples are red"],tip:"Usen objetos reales: this (cerca), that (lejos). Corrijan she / her después del verbo.",m:["Maria is ___ sister.|my|me|I|mine|0","I see Anna. I like ___.|she|her|hers|they|1","___ apples over there are green.|This|That|Those|Her|2"]},
{t:"Artículos y conjunciones",l:"A1",r:"<b>a</b> + sonido consonante, <b>an</b> + sonido vocal, <b>the</b> para algo conocido o único. Conjunciones: <b>and</b> (suma), <b>but</b> (contraste), <b>or</b> (opción), <b>because</b> (razón).",e:["I have an apple and a banana.","I like tea, but I prefer coffee.","I stay home because it is raining."],k:"Fíjate en el sonido, no en la letra: an hour, a university.",v:[["and","y"],["but","pero"],["or","o"],["because","porque"],["umbrella","paraguas"]],d:"A: Do you want tea or coffee? B: I prefer coffee, but I like tea. A: Why are you late? B: Because I missed the bus.",p:["I have an umbrella","I like tea but I prefer coffee","Because it is raining"],tip:"Pídele que una dos frases con and, but, or y because.",m:["She has ___ umbrella.|a|an|the|two|1","I like tea ___ I prefer coffee.|and|but|because|or|1","Why are you late? ___ I missed the bus.|And|Or|Because|But|2"]},
{t:"Preposiciones y there is / there are",l:"A1",r:"<b>in</b> (meses, años, ciudades), <b>on</b> (días, calles, superficies), <b>at</b> (horas), <b>between</b> (entre dos). <b>There is</b> + singular, <b>there are</b> + plural. Pregunta: <i>Is there...?</i> Respuesta: <i>Yes, there is. / No, there isn't.</i>",e:["What is there on the table? There is a cup and a piece of cake.","Isn't there any ice cream? Yes, there is chocolate ice cream.","The bank is between the school and the market."],k:"There is / are concuerda con lo que viene después.",v:[["on the table","sobre la mesa"],["in the box","en la caja"],["at six o'clock","a las seis"],["between","entre"],["a piece of cake","un trozo de pastel"]],d:"A: What is there on the table? B: There is a cup and a piece of cake. A: Is there any ice cream? B: No, there isn't.",p:["There is a cup on the table","The bank is between the school and the market","There are two chairs"],tip:"Describan el salón: There is / There are. La tabla at (horas), on (días), in (meses y años) se memoriza con ejemplos propios.",m:["There ___ a cup and a piece of cake on the table.|are|is|be|have|1","The class starts ___ eight o'clock.|in|on|at|between|2","The bank is ___ the school and the market.|between|in|at|on|0"]},
{t:"Comparaciones",l:"A2",r:"Adjetivo corto: <b>-er than</b> (taller than). Largo: <b>more ... than</b> (more important than). Superlativo: the tallest, the most important. Irregulares: good, better, the best.",e:["This tree is taller than that one.","English is more important than French.","My house is the biggest on the street."],k:"Nunca las dos formas juntas: more bigger es incorrecto.",v:[["taller","más alto"],["bigger","más grande"],["more important","más importante"],["better","mejor"],["the best","el mejor"]],d:"A: My house is bigger than yours. B: Yes, but yours is more beautiful. A: This is the best class.",p:["This tree is taller than that one","English is more important than French","This is the best movie"],tip:"Comparen objetos del salón. Evite more bigger. Memoricen good, better, the best.",m:["This tree is ___ than that one.|tall|taller|tallest|more tall|1","English is ___ important than French.|most|more|much|very|1","She is the ___ student in class.|good|better|best|most good|2"]},
{t:"Was / were y pasado simple",l:"A2",r:"<b>Was / were:</b> I, he, she, it was; you, we, they were. <b>Pasado simple:</b> verbo + -ed o forma irregular (began, took, drove). Negativa y pregunta con <b>did</b>: <i>Did you begin? No, I didn't.</i>",e:["When did you begin classes? I began classes last week.","Did mother enjoy her new car? Yes, she did.","We were not in the city yesterday."],k:"Con did / didn't el verbo va en base: Did you take a taxi?",v:[["yesterday","ayer"],["last week","la semana pasada"],["began","comenzó"],["took","tomó"],["enjoyed","disfrutó"]],d:"A: How did you get here under the rain? B: I took a taxi. A: Did you wait at the bus stop? B: No, I didn't.",p:["I began classes last week","Did mother enjoy her new car","We were not in the city yesterday"],tip:"Cinco verbos irregulares nuevos por día. Error típico: did you went.",m:["When did you begin classes?|I begin classes last week.|I began classes last week.|I beginned last week.|I am begin last week.|1","Did mother enjoy her new car?|Yes, she did.|Yes, she was.|Yes, she does.|Yes, she enjoys.|0","My family ___ in Coronado last weekend.|is|was|were|are|1"]},
{t:"Can y should",l:"A2",r:"<b>Can</b> expresa posibilidad: <i>Where can I have breakfast?</i> Respuesta corta: Yes, I can. / No, I can't. <b>Should</b> da consejos: <i>You should take a bus.</i> Ambos van seguidos de verbo base.",e:["Can I swim in this beach? No, you can't. It is polluted.","What can Helen buy in this store? She can buy souvenirs.","We should call the police to stop that noise."],k:"Can y should no llevan -s ni to: she can buy, he should go.",v:[["can","poder"],["can't","no puede"],["should","debería"],["shouldn't","no debería"],["advice","consejo"]],d:"A: Where can I have breakfast? B: You can go to this restaurant. A: Can I swim here? B: No, you can't. It is polluted.",p:["Where can I have breakfast","You can take a taxi","Everybody should stay home"],tip:"Error típico: she cans o can to swim. Den situaciones para aconsejar con should.",m:["Where ___ I have breakfast?|can|am|do|should to|0","Can I swim in this beach? No, you ___. It is polluted.|can|can't|don't|aren't|1","You look sick. You ___ see a doctor.|should|can to|are|do|0"]},
{t:"Presente continuo",l:"A2",r:"Acción que ocurre ahora: <b>am / is / are + verbo-ing</b>. Pregunta: <i>Are banks working today?</i> Respuesta: No, they are not. Con Where / What: <i>Where is everybody going?</i>",e:["David is driving to Colon now.","Am I interrupting? No, you are not.","Where is everybody going? They are going to a new mall."],k:"No lo uses para hábitos: I work every day (presente simple).",v:[["now","ahora"],["driving","manejando"],["looking for","buscando"],["interrupting","interrumpiendo"],["going","yendo"]],d:"A: Am I interrupting? B: No, you are not. A: Where is everybody going? B: They are going to a new mall.",p:["David is driving to Colon now","Am I interrupting","They are going to a new mall"],tip:"Pregunten What are you doing? mirando fotos. Distingan ahora (continuo) de hábito (simple).",m:["I ___ for a special CD.|look|am looking|looks|am look|1","Are banks working today? No, they ___.|aren't|don't|not are|doesn't|0","Where ___ everybody going?|are|do|is|does|2"]},
{t:"Will y cantidades",l:"A2",r:"<b>Will</b> + verbo: <i>We will need a new refrigerator.</i> Negativa: will not. Pregunta: <i>Who will wash the dog?</i> Respuesta: I will. / I will not. <b>Cantidades:</b> some / any, a lot of, many (contables), much (incontables).",e:["I will buy some rice.","How much coffee do you have?","No, I didn't get any ice."],k:"much con incontables (milk, flour), many con contables (cans).",v:[["some","algo de"],["any","nada de, algún"],["a lot of","mucho"],["many","muchos"],["much","mucho (incontable)"]],d:"A: Who will wash this dog? B: I will. A: How much coffee do you have? B: A lot of coffee.",p:["I will buy some rice","How much coffee do you have","How many cans did you bring"],tip:"Sacar lista de compras: contable o incontable. Practiquen respuestas cortas I will / I will not.",m:["We ___ need a new refrigerator.|will|are|do|did|0","How ___ cans of Pepsi did you bring?|much|many|some|any|1","No, I didn't get ___ ice.|some|a|any|many|2"]},
{t:"Could, might, may y would",l:"B1",r:"Para decir que no estás seguro usa <b>could, might, may + verbo base</b>: <i>It might be a motorcycle.</i> Los tres significan 'tal vez'. <b>Would</b> expresa algo hipotético o una oferta: <i>Would you like some tea?</i>",e:["What is that noise? I don't know, it might be a motorcycle.","Who left this book here? It could be the new student.","Is it still raining? I don't know, but the streets may be flooded."],k:"Después de could / might / may va el verbo base: it may be.",v:[["could","podría"],["might","quizás"],["may","tal vez"],["I don't know","no sé"],["flooded","inundado"]],d:"A: What is that noise? B: I don't know. It might be a motorcycle. A: Where is everybody? B: They could be home.",p:["It might be a motorcycle","It could be Chinese food","They may be home"],tip:"Juego de adivinar el contenido de una caja con could, might y may. Los tres son intercambiables aquí.",m:["What are they serving? I don't know, it ___ be Chinese food.|might|am|do|will to|0","Who left this book here? I don't know. It ___ be the new student.|can to|could|is could|doing|1","Where is everybody today? I don't know. They ___ be home.|may|are|do|did|0"]},
{t:"Presente perfecto",l:"B1",r:"<b>have / has + participio</b>. Une pasado y presente. <b>since</b> + punto en el tiempo (since 2016), <b>for</b> + duración (for 5 years). <b>just</b> (acaba de), <b>already</b> (ya), <b>yet</b> (todavía, en preguntas y negativas).",e:["I have been here since yesterday.","She has gone there since 2016.","I haven't had any food or water in 24 hours."],k:"Con since y for se usa presente perfecto, no pasado simple.",v:[["since","desde"],["for","durante"],["just","acaba de"],["already","ya"],["yet","todavía"]],d:"A: How long has she gone to that salon? B: She has gone there for five years. A: Have you eaten yet? B: No, I have not.",p:["I have been here since yesterday","She has gone there for five years","I have not eaten yet"],tip:"Tabla since (punto) y for (duración) con ejemplos propios. Contrasten con el pasado simple.",m:["I have been here ___ yesterday.|for|since|ago|from|1","She has gone to that salon ___ five years.|since|for|during|at|1","Have you finished your homework ___?|already|just|yet|since|2"]},
{t:"Used to y tag questions",l:"B1",r:"<b>Used to + verbo</b> habla de hábitos del pasado que ya no existen: <i>I used to have long hair.</i> <b>Tag questions:</b> afirmación + coletilla contraria: <i>You live in Chiriqui, don't you? You're Panamanian, aren't you? You can swim, can't you?</i>",e:["He used to smoke, but now he doesn't.","They used to live in Bocas del Toro.","You can swim, can't you?"],k:"Afirmativa lleva coletilla negativa y al revés.",v:[["used to","solía"],["but now","pero ahora"],["don't you","¿no es cierto?"],["aren't you","¿verdad?"],["can't you","¿no?"]],d:"A: You live in Chiriqui, don't you? B: Yes, I do. I used to live in Bocas del Toro.",p:["I used to have long hair","You live in Chiriqui don't you","You can swim can't you"],tip:"Para tag questions: mismo verbo auxiliar, signo contrario. Practiquen 10 con hechos del grupo.",m:["I ___ have long hair, but now I have short hair.|use to|used to|am used|using to|1","You live in Chiriqui, ___?|do you|don't you|aren't you|can't you|1","You're Panamanian, ___?|don't you|aren't you|are you|isn't you|1"]}];
