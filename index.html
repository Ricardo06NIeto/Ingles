<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academia de inglés: ruta a B2</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#2f6fed">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,...">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f2f6f7;--ink:#12263a;--mut:#5b6b7a;--card:#fff;--line:#d5dee3;--acc:#0e7c86;--ok:#2f8f5b;--hi:#f2b84b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--ink:#e6eef3;--mut:#93a4b3;--card:#17252f;--line:#2a3a47;--acc:#4cc3cd;--ok:#5cc58a;--hi:#e0a63a}}
    :root[data-theme="dark"]{--bg:#0f1a24;--ink:#e6eef3;--mut:#93a4b3;--card:#17252f;--line:#2a3a47;--acc:#4cc3cd;--ok:#5cc58a;--hi:#e0a63a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
    header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
    nav{max-width:860px;margin:0 auto;display:flex;gap:8px;padding:8px 12px;overflow-x:auto;align-items:center}
    nav b{font-weight:800;margin-right:12px;white-space:nowrap}
    nav button{background:none;color:var(--ink);border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 12px;font-weight:600;white-space:nowrap}
    nav button.on{border-color:var(--acc);color:var(--acc)}
    main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
    h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
    h2{margin:0 0 8px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
    .card.done{border-left:5px solid var(--ok)}
    .mut{color:var(--mut)}
    button,input[type=text],input[type=password]{font:inherit}
    button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
    button.alt{background:none;color:var(--ink);border:1px solid var(--line)}
    button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
    input[type=text],input[type=password]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
    .ex{background:var(--bg);border-left:4px solid var(--acc);padding:8px 12px;margin:8px 0;border-radius:4px}
    .q{margin:14px 0}.q p{margin:0 0 4px;font-weight:600}
    .o{display:flex;gap:8px;align-items:center;padding:4px 0}.o input{accent-color:var(--acc);width:18px;height:18px}
    .bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc)}
    .o.right{background:color-mix(in srgb,var(--ok) 18%,transparent)}.o.wrong{background:color-mix(in srgb,#c0392b 18%,transparent)}
    .q.ok{border-left:5px solid var(--ok)}.q.bad{border-left:5px solid #c0392b}.exp{font-size:.9rem;color:var(--mut);margin:4px 0 0}
    .tr{display:flex;justify-content:space-between;margin-top:8px;font-weight:600}
    .hero{border:2px solid var(--acc);text-align:center;padding:24px;border-radius:12px}
    button.big{font-size:1.2rem;padding:14px 28px}
    .hero2{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card));border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
    .hmsg{flex:1;min-width:240px}.hmsg h1{margin:6px 0}
  </style>
</head>
<body>

  <header>
    <nav>
      <b>🎓 Academia B2</b>
      <div class="tabs">
        <button class="on">Test de Verbos</button>
      </div>
    </nav>
  </header>

  <main>
    <div class="card" id="quiz-container">
      <div class="hero2">
        <div class="hmsg">
          <h1>Test de Vocabulario Verbal</h1>
          <p class="mut">Completa el examen de verbos académicos regulares e irregulares para validar tu nivel.</p>
        </div>
      </div>

      <div class="bar">
        <i id="quiz-progress" style="width: 0%;"></i>
      </div>
      <div class="tr">
        <span class="mut" id="quiz-step-text">Cargando preguntas...</span>
        <span class="mut" id="quiz-score-text">Puntuación: 0%</span>
      </div>

      <div id="question-box" class="q"></div>

      <div style="margin-top: 18px; text-align: right;">
        <button id="quiz-action-btn" disabled onclick="handleNextStep()">Verificar</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFN73uMbG1tMwcBOmY8Snd-s5jRc-qHks",
      authDomain: "academia-ingles-8191b.firebaseapp.com",
      projectId: "academia-ingles-8191b",
      storageBucket: "academia-ingles-8191b.firebasestorage.app",
      messagingSenderId: "530937495063",
      appId: "1:530937495063:web:79d0b01f089b1bd69be652"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserUID = null;
    let currentQuestionIndex = 0;
    let selectedAnswer = null;
    let correctAnswersCount = 0;
    let isVerified = false;

    let verbsLearned = [];
    let verbsFailed = [];

    const verbQuestions = [
      {
        id: 1, verb: "choose", type: "irregular",
        sentence: "The researchers _________ an alternative theory based on the new data collected last semester.",
        options: ["choosed", "chosen", "chose", "choose"], correct: "chose",
        explanation: "'Chose' es el pasado simple del verbo irregular 'choose'. Se usa aquí porque la acción concluyó en un periodo de tiempo definido."
      },
      {
        id: 2, verb: "conclude", type: "regular-pronunciation",
        sentence: "Identify the word where the '-ed' ending is pronounced as a distinct syllable /ɪd/:",
        options: ["Analyzed", "Developed", "Concluded", "Maintained"], correct: "Concluded",
        explanation: "Los verbos regulares que terminan con sonido /t/ o /d/ (como conclude) añaden la sílaba completa /ɪd/."
      },
      {
        id: 3, verb: "undergo", type: "irregular",
        sentence: "The academic board has _________ structural changes to the graduation curriculum requirements.",
        options: ["undergone", "underwent", "undergo", "undergoneed"], correct: "undergone",
        explanation: "Después del auxiliar 'has' (Presente Perfecto), requerimos el participio pasado del verbo."
      },
      {
        id: 4, verb: "acknowledge", type: "academic-regular",
        sentence: "Before publishing the thesis, the supervisor requested that the students _________ their sources properly.",
        options: ["contradicted", "acknowledged", "arisen", "overcame"], correct: "acknowledged",
        explanation: "'Acknowledged' significa reconocer o dar crédito a las fuentes de investigación de forma formal."
      },
      {
        id: 5, verb: "become", type: "irregular",
        sentence: "Critical thinking skills have _________ essential for passing modern university language evaluations.",
        options: ["became", "become", "becoming", "becomes"], correct: "become",
        explanation: "El participio pasado del verbo irregular 'become' vuelve a ser 'become' (become - became - become)."
      }
    ];

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserUID = user.uid;
        loadQuestion();
      } else {
        currentUserUID = null;
        document.getElementById("question-box").innerHTML = `
          <div class="ex" style="border-left-color: #c0392b;">
            <strong>Acceso denegado:</strong> Por favor, inicia sesión para registrar tus respuestas en la base de datos.
          </div>
        `;
      }
    });

    window.loadQuestion = function() {
      if (!currentUserUID) return;
      const question = verbQuestions[currentQuestionIndex];
      selectedAnswer = null; isVerified = false;
      const actionBtn = document.getElementById("quiz-action-btn");
      actionBtn.innerText = "Verificar"; actionBtn.disabled = true;
      document.getElementById("quiz-step-text").innerText = `Pregunta ${currentQuestionIndex + 1} de ${verbQuestions.length}`;
      const questionBox = document.getElementById("question-box");
      questionBox.className = "q"; 
      
      let optionsHTML = question.options.map((option, idx) => `
        <label class="card o" style="cursor:pointer;" id="opt-container-${idx}">
          <input type="radio" name="verb-opt" value="${option}" onclick="selectOption('${option}', ${idx})">
          <span>${option}</span>
        </label>
      `).join("");

      questionBox.innerHTML = `
        <span class="tag">${question.type.toUpperCase()}</span>
        <p style="margin-top: 10px; font-size: 1.15rem;">${question.sentence}</p>
        <div style="margin-top: 14px;">${optionsHTML}</div>
        <div id="explanation-box" class="ex" style="display:none; margin-top:14px;"></div>
      `;
    }

    window.selectOption = function(optionValue, index) {
      if (isVerified) return;
      selectedAnswer = optionValue;
      document.getElementById("quiz-action-btn").disabled = false;
      verbQuestions[currentQuestionIndex].options.forEach((_, idx) => {
        const container = document.getElementById(`opt-container-${idx}`);
        container.style.border = "1px solid var(--line)";
        container.style.background = "var(--card)";
      });
      const selectedContainer = document.getElementById(`opt-container-${index}`);
      selectedContainer.style.border = "2px solid var(--acc)";
      selectedContainer.style.background = "color-mix(in srgb, var(--acc) 8%, transparent)";
    }

    window.handleNextStep = function() {
      const question = verbQuestions[currentQuestionIndex];
      const actionBtn = document.getElementById("quiz-action-btn");

      if (!isVerified) {
        isVerified = true;
        const isCorrect = (selectedAnswer === question.correct);
        const questionBox = document.getElementById("question-box");

        if (isCorrect) {
          correctAnswersCount++; verbsLearned.push(question.verb);
          questionBox.classList.add("ok");
        } else {
          verbsFailed.push(question.verb);
          questionBox.classList.add("bad");
        }

        question.options.forEach((option, idx) => {
          const container = document.getElementById(`opt-container-${idx}`);
          if (option === question.correct) {
            container.className = "card o right"; container.style.border = "1px solid var(--ok)";
          } else if (option === selectedAnswer) {
            container.className = "card o wrong"; container.style.border = "1px solid #c0392b";
          }
        });

        document.getElementById("explanation-box").style.display = "block";
        document.getElementById("explanation-box").innerHTML = `<strong>${isCorrect ? '¡Excelente!' : 'Incorrecto'}:</strong> ${question.explanation}`;
        document.getElementById("quiz-score-text").innerText = `Puntuación: ${Math.round((correctAnswersCount / verbQuestions.length) * 100)}%`;
        document.getElementById("quiz-progress").style.width = `${((currentQuestionIndex + 1) / verbQuestions.length) * 100}%`;
        actionBtn.innerText = currentQuestionIndex === verbQuestions.length - 1 ? "Finalizar y Guardar" : "Siguiente Pregunta";
      } else {
        if (currentQuestionIndex < verbQuestions.length - 1) {
          currentQuestionIndex++; loadQuestion();
        } else {
          saveResultsToFirestore();
        }
      }
    }

    async function saveResultsToFirestore() {
      if (!currentUserUID) return;
      const quizContainer = document.getElementById("quiz-container");
      quizContainer.innerHTML = `<div style="text-align:center; padding: 40px 0;"><p class="mm">Guardando tu progreso en Firestore de forma segura...</p></div>`;
      try {
        const finalScore = Math.round((correctAnswersCount / verbQuestions.length) * 100);
        const studentDocRef = doc(db, "students", currentUserUID);
        await updateDoc(studentDocRef, {
          done: arrayUnion(...verbsLearned), wrong: arrayUnion(...verbsFailed),
          stats: { lastTestScore: finalScore, totalQuestionsAnswered: verbQuestions.length, correctAnswers: correctAnswersCount },
          updatedAt: serverTimestamp()
        });
        renderFinalResults(finalScore);
      } catch (error) {
        console.error("Error al guardar:", error);
        quizContainer.innerHTML = `<div class="ex" style="border-left-color: #c0392b; padding: 20px;"><strong>Error de almacenamiento:</strong> No se pudo sincronizar el progreso.<p class="mut">${error.message}</p></div>`;
      }
    }

    function renderFinalResults(finalScore) {
      const quizContainer = document.getElementById("quiz-container");
      quizContainer.innerHTML = `
        <div class="hero" style="padding: 32px 16px;">
          <span style="font-size: 3rem;">☁️</span>
          <h2 style="margin-top: 10px;">¡Progreso Guardado!</h2>
          <div style="font-size: 2.5rem; font-weight: 800; color: var(--ok); margin: 15px 0;">${finalScore}%</div>
          <p class="mm">Tus resultados han sido adjuntados a tu ficha de estudiante con éxito.</p>
          <button class="big alt" onclick="window.location.reload()" style="margin-top:12px;">Volver a Empezar</button>
        </div>`;
    }
  </script>
</body>
</html>
