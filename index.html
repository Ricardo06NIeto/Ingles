var P={name:"",pl:null,done:{},rand:"",appr:false,best:null},view="inicio",open=-1;
try{var s=localStorage.getItem("acad");if(s)P=Object.assign(P,JSON.parse(s))}catch(e){}
if(!P.rand){P.rand=Math.random().toString(36).slice(2,8).toUpperCase()}
function nDone(){var n=0;for(var k in P.done)if(P.done[k])n++;return n}
function save(){try{localStorage.setItem("acad",JSON.stringify(P))}catch(e){}}
function go(v){view=v;render()}

function reqCode(){return btoa(unescape(encodeURIComponent(JSON.stringify({n:P.name||"Estudiante",d:nDone(),p:P.pl,r:P.rand}))))}
function render(){var tabs=[["inicio","Inicio"],["lecciones","Lecciones"],["examen","Examen"]],n=document.getElementById("nav");n.innerHTML="<b>Academia B2</b>";
