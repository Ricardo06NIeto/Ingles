function hProf(){var h='<h1>Panel del profesor</h1>',S=ALL.filter(function(x){return (x.email||"").toLowerCase()!=(U.email||"").toLowerCase()});
if(!S.length)return h+'<div class="card"><p class="mut">Aún no hay estudiantes registrados.</p></div>';
S.sort(function(a,b){return String(a.name).localeCompare(String(b.name))});

h+='<div class="card"><h2>'+esc(x.name)+'</h2><p class="mut">'+esc(x.email)+'</p><p>Prueba de nivel: <b>'+(x.pl==null?"sin hacer":x.pl+" / 20")+'</b><br>Lecciones: <b>'+d+' / '+L.length+'</b><br>Examen 1: <b>'+(x.best==null?"sin intentos":x.best+" / 50 en "+x.tries+" intento(s)")+'</b></p><div class="bar"><i style="width:'+Math.round(d/L.length*100)+'%"></i></div><button data-ap="'+esc(x.uid)+'" data-v="'+(ap?0:1)+'">'+(ap?"Retirar aprobación del examen":"Aprobar examen")+'</button></div>'});return h}

var app=initializeApp(FB),auth=getAuth(app),fs=getFirestore(app),U=null,ref=null,unsub=null,unsubAll=null,ALL=[],isT=false,ready=false,pendingName="";
onAuthStateChanged(auth,function(u){ready=true;U=u;if(unsub){unsub();unsub=null}if(unsubAll){unsubAll();unsubAll=null}
if(!u){ref=null;P=blank();ALL=[];isT=false;render();return}
isT=(u.email||"").toLowerCase()==TEACHER_EMAIL.toLowerCase();ref=doc(fs,"students",u.uid);
getDoc(ref).then(function(sn){if(!sn.exists())return setDoc(ref,{name:pendingName||(u.email||"").split("@")[0],email:u.email,pl:null,done:{},best:null,tries:0,approved:{},updatedAt:Date.now()})}).catch(function(){}).then(function(){
unsub=onSnapshot(ref,function(sn){if(sn.exists())P=Object.assign(blank(),sn.data());if(!plOn&&!exOn)render()},function(){});
if(isT)unsubAll=onSnapshot(collection(fs,"students"),function(q){ALL=q.docs.map(function(d){var x=d.data();x.uid=d.id;return x});if(view=="prof"&&!plOn&&!exOn)render()},function(){})});render()});
